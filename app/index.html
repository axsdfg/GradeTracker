  showConfirm('删除后无法恢复，确定删除这场考试吗？', () => {
    state.exams = state.exams.filter(e => e.id !== id);
    state.mistakes.forEach(m => { if (m.examId === id) m.examId = ''; });
    saveState();
    closeModal('detail-modal');
    renderAll();
    toast('已删除');
  }, true);
}

/* ---------------- 滚轮日期 ---------------- */
let wheelState = { target: 'exam', y: 0, m: 0, d: 0 };
const WHEEL_ITEM = 40;

function openWheelPicker(target) {
  wheelState.target = target || 'exam';
  let base = todayISO();
  if (wheelState.target === 'exam') base = $('exam-date').value || todayISO();
  if (wheelState.target === 'nextExam') base = (state.settings.nextExam.date || todayISO());
  const [y, m, d] = base.split('-').map(Number);
  wheelState.y = y; wheelState.m = m; wheelState.d = d;
  buildWheel('wheel-year', 2018, 2035, y, (v) => { wheelState.y = v; updateDays(); });
  buildWheel('wheel-month', 1, 12, m, (v) => { wheelState.m = v; updateDays(); });
  buildWheel('wheel-day', 1, daysInMonth(y, m), d, (v) => { wheelState.d = v; });
  openModal('wheel-overlay');
  $('wheel-overlay').classList.add('show');
}

function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }

function buildWheel(elId, min, max, sel, onChange) {
  const box = $(elId);
  let html = '<div class="wheel-pad"></div>';
  for (let v = min; v <= max; v++) {
    html += `<div class="wheel-item ${v === sel ? 'on' : ''}" data-v="${v}">${v}</div>`;
  }
  html += '<div class="wheel-pad"></div>';
  box.innerHTML = html;
  box.scrollTop = 0;
  const idx = sel - min;
  setTimeout(() => { box.scrollTop = idx * WHEEL_ITEM; }, 0);

  let t = null;
  box.onscroll = () => {
    clearTimeout(t);
    const i = Math.round(box.scrollTop / WHEEL_ITEM);
    box.querySelectorAll('.wheel-item').forEach((it, k) => it.classList.toggle('on', k === i));
    t = setTimeout(() => {
      const v = min + clamp(i, 0, max - min);
      onChange(v);
    }, 90);
  };
}

function updateDays() {
  const maxD = daysInMonth(wheelState.y, wheelState.m);
  if (wheelState.d > maxD) wheelState.d = maxD;
  buildWheel('wheel-day', 1, maxD, wheelState.d, (v) => { wheelState.d = v; });
}

function closeWheelPicker() { $('wheel-overlay').classList.remove('show'); }

function confirmWheelDate() {
  const iso = `${wheelState.y}-${String(wheelState.m).padStart(2, '0')}-${String(wheelState.d).padStart(2, '0')}`;
  if (wheelState.target === 'exam') {
    $('exam-date').value = iso;
    $('exam-date-text').value = fmtDate(iso);
  } else if (wheelState.target === 'nextExam') {
    state.settings.nextExam.date = iso;
    saveState(true);
    renderSettings();
    if (currentView === 'home') renderHome();
    toast('已设置提醒日期');
  }
  closeWheelPicker();
}

/* ---------------- 学期管理 ---------------- */
function openTermModal() { renderTermBody(); openModal('term-modal'); }

function renderTermBody() {
  const box = $('term-body');
  box.innerHTML = `
    <p class="hint" style="margin-bottom:12px">每个学期独立统计。归档旧学期不会删除数据，切换后首页只显示当前学期的考试。</p>
    <div class="list">
      ${state.terms.map(t => {
    const n = examsInTerm(t.id).length;
    const isActive = t.id === state.settings.activeTermId;
    return `<div class="item" style="cursor:default">
          <div class="body">
            <div class="name">${esc(t.name)} ${isActive ? '<span class="badge-mini">当前</span>' : ''}</div>
            <div class="meta">${n} 次考试 · ${fmtDate(t.startDate)} 起</div>
          </div>
          <div style="display:flex;gap:6px;flex:none">
            ${isActive ? '' : `<button class="btn btn-outline btn-sm" onclick="setActiveTerm('${t.id}')">切换</button>`}
            <button class="btn btn-ghost btn-sm" onclick="renameTerm('${t.id}')">改名</button>
            ${n === 0 && state.terms.length > 1 ? `<button class="btn btn-ghost btn-sm" style="color:var(--danger)" onclick="deleteTerm('${t.id}')">删</button>` : ''}
          </div>
        </div>`;
  }).join('')}
    </div>`;
  afterRender();
}

function setActiveTerm(id) {
  state.settings.activeTermId = id;
  saveState(true);
  renderTermBody();
  updateTermLabel();
  renderAll();
  toast('已切换到 ' + termById(id).name);
}

function renameTerm(id) {
  const t = termById(id);
  showPrompt('学期名称', t.name, (v) => {
    t.name = v;
    saveState(true);
    renderTermBody();
    updateTermLabel();
  });
}

function deleteTerm(id) {
  if (examsInTerm(id).length) { toast('该学期还有考试记录，不能删除'); return; }
  showConfirm('删除这个空学期？', () => {
    state.terms = state.terms.filter(t => t.id !== id);
    if (state.settings.activeTermId === id) state.settings.activeTermId = state.terms[0].id;
    saveState(true);
    renderTermBody();
    updateTermLabel();
  }, true);
}

function quickAddTerm() {
  const last = state.terms[state.terms.length - 1];
  let name = '', startDate = '';
  const m = last.name.match(/(\d{4})-(\d{4})\s*学年\s*·\s*(上|下)学期/);
  if (m) {
    const y0 = Number(m[1]);
    if (m[3] === '上') { name = `${y0}-${y0 + 1} 学年 · 下学期`; startDate = `${y0 + 1}-02-01`; }
    else { name = `${y0 + 1}-${y0 + 2} 学年 · 上学期`; startDate = `${y0 + 1}-09-01`; }
  } else {
    const g = guessTerm();
    name = g.name; startDate = g.startDate;
  }
  showPrompt('新学期的名称', name, (v) => {
    const t = { id: 't' + uid(), name: v, startDate, endDate: '' };
    state.terms.push(t);
    state.settings.activeTermId = t.id;
    saveState(true);
    renderTermBody();
    renderAll();
    toast('已新建并切换到 ' + v);
  });
}
</script>
<script>
/* ============================================================
   成绩单卡片（Canvas 绘制，纯本地，不上传）
   ============================================================ */
let shareDataURL = '';
let shareExamId = '';

function currentShareExam() {
  if (shareExamId) {
    const e = state.exams.find(x => x.id === shareExamId);
    if (e) return e;
  }
  if (currentExamId) {
    const e = state.exams.find(x => x.id === currentExamId);
    if (e) return e;
  }
  const pool = sortExams(examsInTerm(state.settings.activeTermId));
  return pool.length ? pool[pool.length - 1] : null;
}

function openShareCard(examId) {
  shareExamId = examId || currentExamId || '';
  const exam = currentShareExam();
  if (!exam) { toast('先录入一场考试'); return; }
  const url = drawShareCard(exam);
  shareDataURL = url;
  $('share-body').innerHTML = `
    <img class="share-preview" src="${url}" alt="成绩单卡片">
    <p class="hint" style="margin-top:10px;text-align:center">
      点击「保存图片」；若没有反应，<b>长按上方图片选择「保存图像」</b>也可以。<br>
      卡片由本机绘制，不含任何网络请求。
    </p>`;
  openModal('share-modal');
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawShareCard(exam) {
  const W = 1080, H = 1500;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const FONT = '"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",-apple-system,sans-serif';

  // 背景
  ctx.fillStyle = '#f4f6f9';
  ctx.fillRect(0, 0, W, H);

  // 顶部品牌区
  const headH = 470;
  const grad = ctx.createLinearGradient(0, 0, W, headH);
  grad.addColorStop(0, '#1e3a5f');
  grad.addColorStop(1, '#2c5282');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, headH);
  // 装饰圆
  ctx.fillStyle = 'rgba(255,255,255,.05)';
  ctx.beginPath(); ctx.arc(W - 80, 60, 240, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(60, headH - 40, 150, 0, Math.PI * 2); ctx.fill();

  const tot = examTotalDisplay(exam);
  const pool = examsInTerm(exam.termId);
  const prev = prevExamOf(exam, pool);
  const tp = prev ? examTotalDisplay(prev) : null;
  const type = EXAM_TYPES[exam.type] || EXAM_TYPES.other;

  ctx.fillStyle = 'rgba(255,255,255,.72)';
  ctx.font = `500 26px ${FONT}`;
  ctx.fillText(translateText('成绩追踪 · 成绩单'), 70, 92);

  ctx.fillStyle = '#fff';
  ctx.font = `700 46px ${FONT}`;
  const nameLines = wrapText(ctx, exam.name, W - 140, 46);
  let ty = 168;
  nameLines.slice(0, 2).forEach(line => { ctx.fillText(line, 70, ty); ty += 56; });

  ctx.fillStyle = 'rgba(255,255,255,.7)';
  ctx.font = `400 26px ${FONT}`;
  ctx.fillText(`${fmtDate(exam.date)}　·　${translateText(type.name)}　·　${termLabel(activeTermOf(exam))}`, 70, ty + 6);

  // 总分
  ctx.fillStyle = '#fff';
  ctx.font = `800 150px ${FONT}`;
  const scoreStr = String(tot.value);
  ctx.fillText(scoreStr, 64, ty + 190);
  const sw = ctx.measureText(scoreStr).width;
  ctx.fillStyle = 'rgba(255,255,255,.65)';
  ctx.font = `500 40px ${FONT}`;
  ctx.fillText(`/ ${tot.full}`, 64 + sw + 24, ty + 190);

  // 变化 / 得分率
  const rate = tot.full ? (tot.value / tot.full * 100).toFixed(1) : '0';
  ctx.font = `500 30px ${FONT}`;
  ctx.fillStyle = 'rgba(255,255,255,.82)';
  let badgeX = 70, badgeY = ty + 232;
  ctx.fillText(translateText('得分率') + ' ' + rate + '%', badgeX, badgeY);
  if (tp) {
    const d = round1(tot.value - tp.value);
    ctx.fillStyle = d >= 0 ? '#86efac' : '#fca5a5';
    ctx.fillText(`${d >= 0 ? translateText('↑ 较上次 +') : translateText('↓ 较上次 ')}${d}`, badgeX + 300, badgeY);
  }

  // 排名
  if (exam.totalClassRank || exam.totalGradeRank) {
    let rx = 70, ry = badgeY + 70;
    const chips = [];
    if (exam.totalClassRank) chips.push(translateText('班级') + ' ' + exam.totalClassRank);
    if (exam.totalGradeRank) chips.push(translateText('年级') + ' ' + exam.totalGradeRank);
    ctx.font = `600 28px ${FONT}`;
    chips.forEach(text => {
      const w = ctx.measureText(text).width + 48;
      ctx.fillStyle = 'rgba(255,255,255,.14)';
      roundRect(ctx, rx, ry - 40, w, 60, 30); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillText(text, rx + 24, ry);
      rx += w + 14;
    });
  }

  // 白色内容卡片
  const cardX = 50, cardY = headH + 36, cardW = W - 100, cardH = H - cardY - 140;
  ctx.save();
  ctx.shadowColor = 'rgba(16,24,40,.10)';
  ctx.shadowBlur = 30;
  ctx.shadowOffsetY = 8;
  ctx.fillStyle = '#fff';
  roundRect(ctx, cardX, cardY, cardW, cardH, 32);
  ctx.fill();
  ctx.restore();

  // 各科
  const rows = scoredEntries(exam);
  const padX = cardX + 50;
  let y = cardY + 76;
  ctx.fillStyle = '#93a0b1';
  ctx.font = `600 24px ${FONT}`;
  ctx.fillText(translateText('各科成绩'), padX, y);
  ctx.textAlign = 'right';
  ctx.fillText(rows.length + ' ' + translateText('科'), cardX + cardW - 50, y);
  ctx.textAlign = 'left';
  y += 34;

  const rowH = Math.min(84, Math.floor((cardH - 130) / Math.max(rows.length, 1)));
  rows.forEach(r => {
    const pct = clamp(r.score / r.full, 0, 1);
    ctx.fillStyle = '#151c27';
    ctx.font = `600 30px ${FONT}`;
    ctx.fillText(subjectLabel(r.subject), padX, y + 26);

    // 条形
    const barX = padX + 170, barW = cardW - 170 - 210, barY = y + 8, barH = 18;
    ctx.fillStyle = '#eef2f7';
    roundRect(ctx, barX, barY, barW, barH, 9); ctx.fill();
    const color = pct >= 0.85 ? '#059669' : pct >= 0.7 ? '#1e3a5f' : pct >= 0.55 ? '#d97706' : '#dc2626';
    ctx.fillStyle = color;
    roundRect(ctx, barX, barY, Math.max(4, barW * pct), barH, 9); ctx.fill();

    ctx.fillStyle = '#151c27';
    ctx.font = `700 30px ${FONT}`;
    ctx.textAlign = 'right';
    ctx.fillText(String(r.score), cardX + cardW - 130, y + 26);
    ctx.fillStyle = '#93a0b1';
    ctx.font = `400 24px ${FONT}`;
    ctx.fillText('/' + r.full, cardX + cardW - 50, y + 26);
    ctx.textAlign = 'left';

    y += rowH;
  });

  // 底部
  ctx.fillStyle = '#93a0b1';
  ctx.font = `400 24px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.fillText(translateText('数据仅保存在本机 · 由「成绩追踪」生成'), W / 2, H - 70);
  ctx.fillStyle = '#c3ccd8';
  ctx.font = `400 20px ${FONT}`;
  ctx.fillText(fmtDate(todayISO()), W / 2, H - 36);
  ctx.textAlign = 'left';

  return cv.toDataURL('image/png');
}

function activeTermOf(exam) {
  return state.terms.find(t => t.id === exam.termId) || state.terms[0];
}

function wrapText(ctx, text, maxWidth, fontSize) {
  const lines = [];
  let cur = '';
  for (const ch of String(text)) {
    const test = cur + ch;
    if (ctx.measureText(test).width > maxWidth && cur) { lines.push(cur); cur = ch; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

function saveShareImage() {
  if (!shareDataURL) return;
  try {
    if (window.AndroidBridge && AndroidBridge.saveImage) {
      AndroidBridge.saveImage(shareDataURL, '成绩单_' + (currentShareExam() || {}).date + '.png');
      toast('已保存到相册');
      return;
    }
  } catch (e) { }
  try {
    const a = document.createElement('a');
    a.href = shareDataURL;
    a.download = '成绩单_' + todayISO() + '.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  } catch (e) { }
  toast('若未开始下载，请长按图片保存');
}
</script>
<script>
/* ============================================================
   错题本
   ============================================================ */
let mistakeFilter = { q: '', subject: 'all', status: 'all' };
let editingMistakeId = null;

function renderMistakesView() {
  const box = $('mistakes-content');
  const open = state.mistakes.filter(m => !m.mastered).length;

  box.innerHTML = `
    <div class="card" style="padding:12px 13px">
      <input class="form-input" id="mk-search" placeholder="搜索题干 / 错因 / 标签" value="${esc(mistakeFilter.q)}"
             oninput="mistakeFilter.q=this.value;renderMistakeList()">
      <div class="chip-row" style="margin-top:9px">
        <button class="chip ${mistakeFilter.status === 'all' ? 'on' : ''}" onclick="mistakeFilter.status='all';renderMistakesView()">全部</button>
        <button class="chip ${mistakeFilter.status === 'open' ? 'on' : ''}" onclick="mistakeFilter.status='open';renderMistakesView()">${translateText('未掌握')} ${open ? '(' + open + ')' : ''}</button>
        <button class="chip ${mistakeFilter.status === 'done' ? 'on' : ''}" onclick="mistakeFilter.status='done';renderMistakesView()">已掌握</button>
      </div>
      <div class="chip-row" style="margin-top:7px">
        <button class="chip ${mistakeFilter.subject === 'all' ? 'on' : ''}" onclick="mistakeFilter.subject='all';renderMistakesView()">全科</button>
        ${visibleSubjects().map(s => `<button class="chip ${mistakeFilter.subject === s.id ? 'on' : ''}"
          onclick="mistakeFilter.subject='${s.id}';renderMistakesView()">${esc(s.name)}</button>`).join('')}
      </div>
    </div>
    <div id="mistake-list"></div>
    <div class="hint" style="text-align:center;margin:14px 0">${translateText('共')} ${state.mistakes.length} ${translateText('条')} · ${translateText('未掌握')} ${open} ${translateText('条')}</div>`;
  renderMistakeList();
  afterRender();
}

function renderMistakeList() {
  const box = $('mistake-list');
  if (!box) return;
  const list = state.mistakes.filter(m => {
    if (mistakeFilter.subject !== 'all' && m.subjectId !== mistakeFilter.subject) return false;
    if (mistakeFilter.status === 'open' && m.mastered) return false;
    if (mistakeFilter.status === 'done' && !m.mastered) return false;
    if (mistakeFilter.q) {
      const hay = [m.title, m.reason, m.answer, (m.tags || []).join(' ')].join(' ').toLowerCase();
      if (!hay.includes(mistakeFilter.q.toLowerCase())) return false;
    }
    return true;
  }).sort((a, b) => (a.mastered - b.mastered) || String(b.date).localeCompare(String(a.date)));

  box.innerHTML = list.length ? `<div class="list">
      ${list.map(m => {
    const subj = subjectById(m.subjectId);
    const exam = state.exams.find(e => e.id === m.examId);
    return `<div class="item" style="align-items:flex-start;cursor:pointer" onclick="openMistakeModal('${m.id}')">
          <div class="body">
            <div class="name" style="${m.mastered ? 'text-decoration:line-through;color:var(--muted)' : ''}">${esc(m.title || '未命名错题')}</div>
            <div class="meta">
              <span class="tag">${esc(subjectLabel(subj))}</span>
              <span class="tag">${esc(m.reason || '未标注')}</span>
              ${exam ? `<span>${esc(exam.name)}</span>` : ''}
              <span>${fmtDate(m.date)}</span>
            </div>
            ${m.answer ? `<div class="hint" style="margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(m.answer)}</div>` : ''}
            ${(m.tags && m.tags.length) ? `<div class="meta" style="margin-top:5px">${m.tags.map(t => `<span class="tag">#${esc(translateText(t.tag || t))}</span>`).join(' ')}</div>` : ''}
          </div>
          <button class="btn btn-ghost btn-sm" style="flex:none;color:${m.mastered ? 'var(--ok)' : 'var(--muted)'}"
            onclick="event.stopPropagation();toggleMistake('${m.id}')">${m.mastered ? '✓' : '○'}</button>
        </div>`;
  }).join('')}
    </div>` : `<div class="card"><div class="empty">
        <b>${state.mistakes.length ? '没有符合条件的错题' : '错题本还是空的'}</b>
        ${state.mistakes.length ? '换个筛选条件试试。' : '把每次考试的失分点记下来，比刷十套卷更有用。<br>点下方按钮开始。'}
        <div style="margin-top:14px"><button class="btn btn-primary btn-sm" onclick="openMistakeModal()">记录错题</button></div>
      </div></div>`;
  afterRender();
}

function openMistakeModal(id) {
  editingMistakeId = id || null;
  const m = id ? state.mistakes.find(x => x.id === id) : null;
  $('mistake-modal-title').textContent = m ? '编辑错题' : '记录错题';

  $('mk-subject').innerHTML = visibleSubjects().map(s =>
    `<option value="${s.id}" ${m && m.subjectId === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('');

  const pool = sortExams(examsInTerm(state.settings.activeTermId)).reverse();
  $('mk-exam').innerHTML = '<option value="">不关联</option>' + pool.map(e =>
    `<option value="${e.id}" ${m && m.examId === e.id ? 'selected' : ''}>${esc(e.name)}</option>`).join('');

  $('mk-title').value = m ? m.title : '';
  $('mk-reason').value = m ? (m.reason || '概念不清') : '概念不清';
  $('mk-answer').value = m ? (m.answer || '') : '';
  $('mk-tags').value = m ? (m.tags || []).join(',') : '';
  $('mk-mastered-chips').innerHTML = `
    <button class="chip ${!m || !m.mastered ? 'on' : ''}" data-v="0" onclick="pickChip('mk-mastered-chips',this)">未掌握</button>
    <button class="chip ${m && m.mastered ? 'on' : ''}" data-v="1" onclick="pickChip('mk-mastered-chips',this)">已掌握</button>`;

  // 删除按钮
  let footer = $('mistake-modal').querySelector('.modal-footer');
  if (!footer.querySelector('.mk-del')) {
    const btn = document.createElement('button');
    btn.className = 'btn btn-danger btn-sm mk-del';
    btn.style.flex = '0 0 auto';
    btn.textContent = '删除';
    btn.onclick = () => deleteMistake(editingMistakeId);
    footer.insertBefore(btn, footer.firstChild);
  }
  footer.querySelector('.mk-del').style.display = m ? 'inline-flex' : 'none';

  openModal('mistake-modal');
}

function saveMistake() {
  const title = $('mk-title').value.trim();
  if (!title) { toast('请填写题目简述'); return; }
  const payload = {
    id: editingMistakeId || uid(),
    subjectId: $('mk-subject').value,
    examId: $('mk-exam').value,
    title,
    reason: $('mk-reason').value,
    answer: $('mk-answer').value.trim(),
    tags: $('mk-tags').value.split(/[,，\s]+/).map(t => t.trim()).filter(Boolean),
    mastered: chipValue('mk-mastered-chips') === '1',
    date: editingMistakeId ? (state.mistakes.find(m => m.id === editingMistakeId) || {}).date || todayISO() : todayISO()
  };
  if (editingMistakeId) {
    const i = state.mistakes.findIndex(m => m.id === editingMistakeId);
    if (i >= 0) state.mistakes[i] = payload;
  } else {
    state.mistakes.unshift(payload);
  }
  saveState();
  closeModal('mistake-modal');
  editingMistakeId = null;
  toast('已保存');
  if (currentView === 'mistakes') renderMistakesView();
}

function toggleMistake(id) {
  const m = state.mistakes.find(x => x.id === id);
  if (!m) return;
  m.mastered = !m.mastered;
  saveState(true);
  renderMistakesView();
  toast(m.mastered ? '标记为已掌握' : '已取消掌握标记');
}

function deleteMistake(id) {
  if (!id) return;
  showConfirm('删除这道错题？', () => {
    state.mistakes = state.mistakes.filter(m => m.id !== id);
    saveState();
    closeModal('mistake-modal');
    editingMistakeId = null;
    renderMistakesView();
    toast('已删除');
  }, true);
}

function updateSubject(idx, field, value) {
  const sub = state.subjects[idx];
  if (!sub) return;
  if (field === 'fullScore') sub.fullScore = Number(value) || 100;
  else if (field === 'targetScore') sub.targetScore = value === '' ? null : Number(value);
  else if (field === 'weight') sub.weight = Number(value) > 0 ? Number(value) : 1;
  saveState(true);
  // 轻量更新合计，避免整页重绘打断输入
  const sumEl = $('fullsum-label');
  if (sumEl) {
    const fullSum = visibleSubjects().reduce((a, b) => a + Number(b.fullScore || 0), 0);
    sumEl.textContent = translateText('满分合计') + ' ' + fullSum;
    afterRender($('settings-content'));
  }
}

function toggleSubject(idx, field) {
  const sub = state.subjects[idx];
  if (!sub) return;
  sub[field] = !sub[field];
  saveState(true);
  renderSettings();
  if (currentView === 'home') renderHome();
}

function applyWeightPreset() {
  state.subjects.forEach(s => {
    s.weight = ['chinese', 'math', 'english'].includes(s.id) ? 1.5 : 1;

  saveState(true);
  renderSettings();
  toast('已按语数英 ×1.5 设置权重');
}

function resetWeights() {
  state.subjects.forEach(s => s.weight = 1);
  saveState(true);
  renderSettings();

/* ---------------- 导入导出 ---------------- */
function downloadText(filename, text, mime) {
  try {
    const blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return true;
  } catch (e) { return false; }
}

function showTextOutput(title, filename, text, mime) {
  $('dialog-message').innerHTML = `
    <div style="font-size:15px;font-weight:650;margin-bottom:6px">${esc(title)}</div>
    <div class="hint" style="text-align:left;margin-bottom:8px">点文本框可全选复制；也可以点「下载」尝试保存为文件。</div>
    <textarea class="form-input" id="out-text" style="height:150px;font-size:12px;text-align:left"
      onclick="this.select()">${esc(text)}</textarea>`;
  $('dialog-actions').innerHTML = `
    <button class="btn btn-outline btn-block" id="dlg-cancel">关闭</button>
    <button class="btn btn-primary btn-block" id="dlg-ok">下载</button>`;
  $('dialog-overlay').classList.add('show');
  $('dlg-cancel').onclick = () => $('dialog-overlay').classList.remove('show');
  $('dlg-ok').onclick = () => {
    const ok = downloadText(filename, text, mime);
    toast(ok ? '已开始下载' : '下载失败，请手动复制');
  };
}

function exportAppData() {
  const json = JSON.stringify(state, null, 2);

  if (window.AndroidBridge && AndroidBridge.saveFile) {
    try { AndroidBridge.saveFile(name, json, 'application/json'); toast('已保存：' + name); return; } catch (e) { }
  }
  showTextOutput('备份数据（' + name + '）', name, json, 'application/json');
}

function csvCell(v) {
  const s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportCSV() {
  const subs = visibleSubjects();
  const head = ['日期', '学期', '考试名称', '类型', '总分', ...subs.map(s => s.name), '班排', '年排', '备注'];
  const rows = sortExams(state.exams).map(e => {
    const t = examTotalDisplay(e);
    return [e.date, (state.terms.find(x => x.id === e.termId) || {}).name || '', e.name,
    (EXAM_TYPES[e.type] || {}).name || '', t.value,
    ...subs.map(s => { const r = e.scores[s.id]; return r && r.score != null ? r.score : ''; }),
    e.totalClassRank || '', e.totalGradeRank || '', e.note || ''];
  });
  const csv = '\ufeff' + [head, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n');
  const name = `成绩明细_${todayISO()}.csv`;
  if (window.AndroidBridge && AndroidBridge.saveFile) {
    try { AndroidBridge.saveFile(name, csv, 'text/csv'); toast('已保存：' + name); return; } catch (e) { }
  }
  showTextOutput('成绩表（' + name + '）', name, csv, 'text/csv');
}

    showAlert('文件格式不正确：缺少 subjects / exams');

  showConfirm(`导入将覆盖当前 ${state.exams.length} 条考试记录，确定继续？`, () => {

      <code>日期, 考试名称, 科目, 分数</code>（可选：满分、班排、年排）<br>

  $('dialog-actions').innerHTML = `

      showAlert('导入失败：' + err.message);
    }

}

function importExamTable(text) {
  const lines = String(text).split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (lines.length < 2) throw new Error('至少需要表头和一行数据');
  const split = (l) => l.split(/\t|,|，/).map(c => c.trim().replace(/^"|"$/g, ''));
  const head = split(lines[0]);
  const idxOf = (names) => head.findIndex(h => names.some(n => h.includes(n)));
  const iDate = idxOf(['日期', 'date']);
  const iName = idxOf(['考试', '名称', 'name']);
  const iSubj = idxOf(['科目', '学科', 'subject']);
  const iScore = idxOf(['分数', '得分', 'score']);
  const iFull = idxOf(['满分', 'full']);
  const iClass = idxOf(['班排', '班级排名']);
  const iGrade = idxOf(['年排', '年级排名']);
  if ([iDate, iName, iSubj, iScore].some(i => i < 0)) throw new Error('表头缺少 日期/考试名称/科目/分数');

  const groups = {};
  let rows = 0;
  for (let i = 1; i < lines.length; i++) {
    const c = split(lines[i]);
    if (!c[iDate] || !c[iSubj]) continue;
    const date = normalizeDateStr(c[iDate]);
    const name = c[iName] || '导入的考试';
    const subjName = c[iSubj];
    const sub = state.subjects.find(s => s.name === subjName) ||
      state.subjects.find(s => s.name.includes(subjName) || subjName.includes(s.name));
    if (!sub) continue;
    const score = Number(String(c[iScore]).replace(/[^\d.]/g, ''));
    if (isNaN(score)) continue;
    const key = date + '|' + name;
    if (!groups[key]) groups[key] = { date, name, scores: {} };
    groups[key].scores[sub.id] = {
      score,
      fullScore: iFull >= 0 && c[iFull] ? Number(c[iFull]) : sub.fullScore,
      classRank: iClass >= 0 && c[iClass] ? Number(c[iClass]) : null,
      gradeRank: iGrade >= 0 && c[iGrade] ? Number(c[iGrade]) : null
    };
    rows++;
  }
  const keys = Object.keys(groups);
  if (!keys.length) throw new Error('没有识别到有效数据行');

  const termId = state.settings.activeTermId;
  keys.forEach(k => {
    const g = groups[k];
    const exist = state.exams.find(e => e.date === g.date && e.name === g.name);
    if (exist) Object.assign(exist.scores, g.scores);
    else state.exams.push({
      id: uid(), name: g.name, date: g.date, type: 'other', termId,
      totalClassRank: null, totalGradeRank: null, note: '表格导入', scores: g.scores
    });
  });
  saveState();
  return { exams: keys.length, rows };
}

function normalizeDateStr(v) {
  const s = String(v).replace(/[./]/g, '-').trim();
  const m = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${String(m[2]).padStart(2, '0')}-${String(m[3]).padStart(2, '0')}`;
  const d = new Date(s);
  if (!isNaN(d)) return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  return todayISO();
}

}

function injectDemo() {
  const termId = state.settings.activeTermId;
  const now = new Date();
  const names = ['开学摸底考', '第一次月考', '期中考试', '第二次月考'];
  const base = { chinese: 96, math: 102, english: 108, physics: 68, chemistry: 70, biology: 72, politics: 66, history: 68, geography: 70 };
  const step = { chinese: 3, math: 5, english: 2, physics: 3, chemistry: 2, biology: 2, politics: 3, history: 2, geography: 2 };
  names.forEach((n, i) => {
    const d = new Date(now.getFullYear(), now.getMonth() - (3 - i), 12);
    const date = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const scores = {};
    visibleSubjects().forEach(s => {
      const jitter = Math.round((Math.random() - 0.45) * 8);
      const val = clamp((base[s.id] || 70) + (step[s.id] || 2) * i + jitter, 40, s.fullScore);
      scores[s.id] = { score: val, fullScore: s.fullScore, classRank: null, gradeRank: null };
    });
    state.exams.push({
      id: uid(), name: n, date, type: i === 2 ? 'midterm' : 'monthly', termId,
      totalClassRank: 18 - i * 2, totalGradeRank: 210 - i * 12, note: '示例数据', scores
    });
  });
  if (!state.mistakes.length) {
    state.mistakes.push({
      id: uid(), subjectId: 'math', examId: '', title: '导数第二问：极值点偏移构造', reason: '方法不会',
      answer: '先移项构造对称函数，再用单调性证明；注意端点代入验证。', tags: ['导数', '压轴'],
      mastered: false, date: todayISO()
    });
  }
  saveState();
  renderAll();
  toast('已载入示例数据，可随时清空');
}
</script>
<script>
/* ============================================================
   启动
   ============================================================ */
function init() {
  loadState();
  applyParentMode();
  applyLanguage(langSetting(), { silent: true });
  startI18nObserver();
  applyTheme();
  updateTermLabel();
  switchView('home');

  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = () => { if ((state.settings.theme || 'auto') === 'auto') applyTheme(); };
    if (mq.addEventListener) mq.addEventListener('change', onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }

  // 首页返回键：单页无路由，交给页面处理（原生 patch 会调用）
  window.appHandleBack = function () {
    const openOverlay = document.querySelector('.modal-overlay.show, .dialog-overlay.show, .wheel-overlay.show');
    if (openOverlay) { openOverlay.classList.remove('show'); return true; }
    if (currentView !== 'home') { switchView('home'); return true; }
    return false;
  };

  // 节流后的静默检查（仅在配置了数据源时）
  setTimeout(autoCheckScoreData, 1600);
}

function boot() {
  if (window.__appInited) return;
  window.__appInited = true;
  init();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
</body>
